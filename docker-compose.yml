services:
  # MCP Server (stdio transport - used by IDE)
  # Note: The MCP server uses stdio, so it runs locally.
  # This Docker image is for packaging and distribution.
  
  sync-server:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - ELITE_BRAIN_DIR=/data/brain
      - ELITE_CENTRAL_DIR=/data/brain
      - ELITE_LOG_LEVEL=INFO
      - SYNC_API_KEY=${SYNC_API_KEY:?Set SYNC_API_KEY before starting the sync server}
    volumes:
      - brain-data:/data/brain
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["core.integration.sync_server:app", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request; request = urllib.request.Request('http://localhost:8765/api/health'); request.add_header('X-Elite-Sync-Key', os.environ['SYNC_API_KEY']); urllib.request.urlopen(request, timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  brain-data:
