[project]
name = "elite-reasoning-mcp"
version = "2.4.0"
description = "The Unified Cognitive Operating System for AI Coding Agents: 9-Stage Cognitive Loop, Process Reward Model (PRM), Deterministic AST Invariant Gates, Stanford STORM Deep Research, and Trusted Memory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sneh Gabani", email = "snehgabani@gmail.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "ai-ide",
    "reasoning",
    "reasoning-safety",
    "ai-agent",
    "ai-coding",
    "coding-agent",
    "llm",
    "agent-memory",
    "memory",
    "process-reward-model",
    "ast-gating",
    "self-discover",
    "storm-research",
    "workflow-automation",
    "workflow-recorder",
    "evals",
    "promptfoo",
    "deepeval",
    "inspect-ai",
    "release-automation",
    "anti-pattern",
    "decision-making",
    "confidence-calibration",
    "knowledge-graph",
    "cursor",
    "vscode",
    "claude",
    "gemini",
    "windsurf",
    "ai-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.3.0",
    "fastmcp>=2.14.0",
    "pydantic>=2.13.4,<3",
    "rich>=15.0.0,<16",
    "python-dotenv>=1.2.3,<2",
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.3,<1",
    "httpx>=0.28.1,<1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.6",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "scipy>=1.17.1",
    "networkx>=3.6.1",
    "beautifulsoup4>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/Snehgabani/elite-reasoning-mcp"
Repository = "https://github.com/Snehgabani/elite-reasoning-mcp"
Documentation = "https://github.com/Snehgabani/elite-reasoning-mcp#readme"
"Bug Tracker" = "https://github.com/Snehgabani/elite-reasoning-mcp/issues"
Changelog = "https://github.com/Snehgabani/elite-reasoning-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
vectors = [
    "sqlite-vec>=0.1.9",
    "sentence-transformers>=6.0.0",
]
graph = [
    "langgraph>=1.2.11",
    "langchain-core>=1.5.6",
    "networkx>=3.6.1",
]
dev = [
    "bandit>=1.9.4,<2",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
]
all = [
    "elite-reasoning-mcp[vectors,graph,dev]",
]

[project.scripts]
elite-reasoning-mcp = "core.integration.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.hatch.build.targets.sdist]
include = [
    "/core",
    "/assets/hero-banner.png",
    "/docs",
    "/scripts",
    "/tests",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/GOVERNANCE.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/pyproject.toml",
]
exclude = [
    "brain/",
    "brain_central/",
    "config.json",
    "team-memory.json",
    "telemetry-ui/",
    "diagnostics/*.zip",
    "_archive/",
    "uv.lock",
    "*.db",
    "*.db-shm",
    "*.db-wal",
    "*.db-*",
    "*.zip",
    "*.log",
    "mcp_error.log",
    ".venv/",
    "node_modules/",
    ".next/",
    "__pycache__/",
    "*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_archive", ".venv", "telemetry-ui", "brain", "brain_central"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line-too-long — handled by formatter, not blocker
    "E701",   # multiple-statements-on-one-line — compact patterns
    "E702",   # multiple-statements-on-one-line-semicolon
    "E741",   # ambiguous-variable-name — l, O, I in math code
    "W291",   # trailing-whitespace
    "W293",   # blank-line-with-whitespace
    "I001",   # import sorting
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841", "E402", "I001"]  # tests use inline imports and temp vars
"core/cognitive/**" = ["F401", "F841", "E402", "I001"]  # cognitive loop and leverage submodules
"core/tools/cognitive_tools.py" = ["F401", "F841", "E402", "I001"]
