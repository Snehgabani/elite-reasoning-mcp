name: 💡 Feature Request
description: Suggest a new tool, feature, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share the user leverage, MCP workflow impact, and validation path. For broad ideas, GitHub Discussions may be a better first step.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about?
  - type: textarea
    id: leverage
    attributes:
      label: User Leverage
      description: Who benefits, how often, and what measurable workflow improvement should this create?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation Plan
      description: What tests, evals, release-gate checks, or before/after examples would prove this works?
