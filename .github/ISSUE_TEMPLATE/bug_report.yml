name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, tokens, private code, or sensitive memory contents. Security issues should be reported privately using the security policy.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Install elite-reasoning-mcp
        2. Call tool X with arguments Y
        3. See error Z
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of elite-reasoning-mcp are you using?
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: ide
    attributes:
      label: IDE
      options:
        - Cursor
        - Antigravity
        - VS Code + Continue
        - Windsurf
        - Claude Desktop
        - Gemini CLI
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "3.11"
  - type: textarea
    id: release-gate
    attributes:
      label: Release Gate Output
      description: Paste the relevant output from `uv run python scripts/release_check.py` if this reproduces from a checkout.
      render: shell
  - type: textarea
    id: privacy-impact
    attributes:
      label: Memory or Privacy Impact
      description: Did this expose, corrupt, over-inject, or mis-scope persisted memory? If yes, describe without sharing sensitive data.
