name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@169da61f67f22dd2a20b72a6b2fa47f52cae3bf7 # v5.3.1

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run Property-Based Fuzzing Tests
        run: |
          uv run pytest tests/ -k "fuzz or hypothesis or test_unified_mix_tools or test_nuclear_prompt" -v
        env:
          HYPOTHESIS_PROFILE: ci
