name: Autonomous Issue & PR Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Triage Issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const text = `${issue.title} ${issue.body || ''}`.toLowerCase();
            const labels = [];

            if (/(bug|error|fail|crash|broken)/i.test(text)) labels.push('bug');
            if (/(feat|add|support|improve|enhancement)/i.test(text)) labels.push('enhancement');
            if (/(doc|readme|guide)/i.test(text)) labels.push('documentation');
            if (/(security|vulnerability|cve|leak)/i.test(text)) labels.push('security');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels,
              });
            }
