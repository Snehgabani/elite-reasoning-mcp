name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          checksum="$RUNNER_TEMP/gitleaks.sha256"
          destination="$RUNNER_TEMP/gitleaks"
          mkdir -p "$destination"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" > "$checksum"
          sha256sum --check --status "$checksum"
          tar -xzf "$archive" -C "$destination"

      - name: Scan committed history
        run: "$RUNNER_TEMP/gitleaks/gitleaks git --redact --no-banner --log-opts=--all ."

      - name: Scan checked-out files
        run: "$RUNNER_TEMP/gitleaks/gitleaks dir --redact --no-banner ."
