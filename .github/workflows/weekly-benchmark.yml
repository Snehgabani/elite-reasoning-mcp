name: Weekly Performance & Invariant Benchmark

on:
  schedule:
    - cron: "0 5 * * 0" # Weekly Sunday at 5 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run Cognitive Invariant Benchmark
        run: |
          uv run python -c "
          import time
          from core.cognitive.engine import _COGNITIVE_ENGINE
          
          start = time.perf_counter()
          res = _COGNITIVE_ENGINE.execute('Evaluate AST syntax parsing and diff barriers under high throughput', task_type='hard_problem')
          elapsed = (time.perf_counter() - start) * 1000
          
          print(f'Benchmark completed in {elapsed:.2f}ms')
          assert res['status'] == 'SUCCESS', 'Benchmark execution failed'
          assert res['prm_passed'] == True, 'PRM verification invariant violated'
          print('✅ All cognitive performance and safety benchmarks verified.')
          "
