name: Autonomous Release Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-release') && !contains(github.event.head_commit.message, 'chore(release)')"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Check and Create GitHub Release if Tag Missing
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v$VERSION"
          echo "Package version: $VERSION (Target tag: $TAG)"

          git fetch --tags --force || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ GitHub Release $TAG already exists. No new release needed."
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists. Creating automated GitHub Release from tag."
            gh release create "$TAG" \
              --title "Elite Reasoning MCP $TAG" \
              --generate-notes || true
            echo "✅ Created release $TAG"
          else
            echo "Creating automated GitHub Release for $TAG"
            gh release create "$TAG" \
              --title "Elite Reasoning MCP $TAG" \
              --generate-notes \
              --target main || true
            echo "✅ Created release $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
