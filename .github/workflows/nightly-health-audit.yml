name: Nightly Invariant & E2E Health Audit

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-audit:
    name: Subsystem Invariant & Release Readiness Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Execute System Health Doctor Diagnostic
        run: uv run elite-reasoning-mcp doctor --json

      - name: Run Full Release Gate & Invariant Tests
        run: uv run python scripts/release_check.py
        env:
          ELITE_BRAIN_DIR: /tmp/elite-nightly-brain

      - name: Run Automated Reasoning Smokes
        run: |
          uv run python -c "
          from core.cognitive.engine import _COGNITIVE_ENGINE
          res = _COGNITIVE_ENGINE.execute('Verify system health invariants end-to-end', task_type='hard_problem')
          assert res['status'] == 'SUCCESS', 'Cognitive engine self-test failed'
          assert res['quality_score'] >= 0.70, 'Quality score below threshold'
          print('✅ Nightly cognitive engine verification passed perfectly.')
          "
