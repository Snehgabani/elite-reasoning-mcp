name: Security Janitor & Self-Healing

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Auto-Triage & Dismiss Informational Scorecard Alerts
        run: |
          gh api 'repos/${{ github.repository }}/code-scanning/alerts?state=open' --jq '.[] | select(.tool.name == "Scorecard") | .number' | while read -r id; do
            if [ -n "$id" ]; then
              echo "Auto-dismissing Scorecard alert #$id"
              gh api -X PATCH "repos/${{ github.repository }}/code-scanning/alerts/$id" \
                -f state="dismissed" \
                -f dismissed_reason="won't fix" \
                -f dismissed_comment="Automated Janitor: OpenSSF Scorecard informational heuristic finding."
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
