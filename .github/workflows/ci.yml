name: Science-Grade CI/CD Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gates:
    name: "Science Gates (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      
      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
      
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      
      - name: Install Frozen Dependencies with Dev Extras
        run: uv sync --frozen --extra dev
      
      - name: Run Full Science-Grade Release & Verification Gates
        run: uv run --extra dev python scripts/release_check.py
        env:
          ELITE_BRAIN_DIR: /tmp/elite-test-brain

      - name: Append Quality Scorecard to Job Summary
        if: always()
        run: |
          if [ -f DOUBLE_BLIND_SCORECARD.md ]; then
            cat DOUBLE_BLIND_SCORECARD.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Quality Scorecard Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: science-grade-scorecard-${{ matrix.python-version }}
          path: DOUBLE_BLIND_SCORECARD.md
          if-no-files-found: ignore
