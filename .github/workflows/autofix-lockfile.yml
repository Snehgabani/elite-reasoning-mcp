name: Auto-Heal Lockfile

on:
  push:
    paths:
      - "pyproject.toml"
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heal-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Update uv lockfile
        run: uv lock

      - name: Commit changes if out of sync
        run: |
          if ! git diff --quiet uv.lock; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(lockfile): auto-heal and sync uv.lock [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "uv.lock is already synchronized."
          fi
